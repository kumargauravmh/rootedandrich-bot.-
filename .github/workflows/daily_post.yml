name: Rooted and Rich - Reel Post (5 a week)

on:
  schedule:
    # GitHub runs cron jobs HOURS late, so we trigger EARLY (two tries) and the job
    # itself waits until exactly 8:00 PM IST before publishing.
    # Days (UTC): 6=Sat 0=Sun 1=Mon 3=Wed 5=Fri
    - cron: '30 6 * * 6,0,1,3,5'    # 12:00 PM IST
    - cron: '30 10 * * 6,0,1,3,5'   # 4:00 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build the reel and attach it to this run, do NOT post to Instagram'
        default: 'true'
        required: true

permissions:
  contents: write

# One post lane: a second trigger queues behind the first, then the gate sees
# "already posted today" and skips.
concurrency:
  group: post-lane
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Should this run post?
        id: gate
        run: python scripts/slot.py gate

  post:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure ffmpeg
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: pip install pillow requests

      # Takes the next unpublished item from content/queue/. If the queue is
      # empty this step FAILS on purpose (you get a GitHub email).
      - name: Build the one-frame reel
        id: build
        run: python scripts/single_reel.py

      - name: Collect this run's reel (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          mkdir dryrun_out
          SLUG=$(cat posts/latest.txt)
          cp posts/reel_$SLUG.mp4 dryrun_out/
          cp posts/caption_$SLUG.txt dryrun_out/
          cp reel_build/frame.png dryrun_out/
          ls -la dryrun_out
          echo "### Caption that would be posted" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat posts/caption_$SLUG.txt >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Attach reel (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-post
          path: dryrun_out/
          retention-days: 7

      # Fails early, with a readable reason, if a token is expired. Runs on dry runs too.
      - name: Check Instagram token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: python scripts/post_reel.py --check-token

      # Everything is built and checked. Now sleep until exactly 8:00 PM IST.
      - name: Wait for 8:00 PM IST
        if: ${{ github.event_name == 'schedule' }}
        run: python scripts/slot.py wait

      - name: Commit and push generated post record
        if: ${{ steps.build.outputs.generated == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add posts/latest.txt posts/latest_item.txt posts/latest_format.txt posts/caption_*.txt
          git commit -m "Post $(cat posts/latest.txt)" || echo "Nothing to commit"
          git pull --rebase
          git push

      - name: Publish to Instagram
        if: ${{ steps.build.outputs.generated == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: python scripts/post_reel.py

      # Only after a successful publish: mark the item used and record today's
      # IST date so a second trigger cannot post again.
      - name: Mark queue item as published
        if: ${{ steps.build.outputs.generated == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          python scripts/single_reel.py --mark-published
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add content/state.json
          git commit -m "Mark $(cat posts/latest_item.txt) as published" || echo "Nothing to commit"
          git pull --rebase
          git push
