name: Rooted and Rich - Weekly Carousel Reel

on:
  schedule:
    # All times UTC. IST = UTC + 5:30. Days: 0=Sun 2=Tue 4=Thu
    - cron: '30 14 * * 2'   # Tuesday  8:00 PM IST
    - cron: '30 14 * * 4'   # Thursday 8:00 PM IST
    - cron: '30 14 * * 0'   # Sunday   8:00 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build the reel and attach it to this run, do NOT post to Instagram'
        default: 'true'
        required: true

permissions:
  contents: write

# Never let two runs overlap (a manual run during a scheduled one, etc.).
# Shares a lane with the research workflow so their git pushes never collide.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure ffmpeg
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: pip install pillow requests

      # Takes the next unpublished item from content/queue/. If the queue is
      # empty this step FAILS on purpose (you get a GitHub email) instead of
      # posting something old.
      - name: Build reel + caption from the content queue
        id: build
        run: python scripts/carousel_reel.py

      # Dry run: attach ONLY the reel that was just built (not the 100+ old ones in posts/)
      - name: Collect this run's reel (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          mkdir dryrun_out
          SLUG=$(cat posts/latest.txt)
          cp posts/reel_$SLUG.mp4 posts/caption_$SLUG.txt dryrun_out/
          ls -la dryrun_out
          echo "### Caption that would be posted" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat posts/caption_$SLUG.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Attach reel (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-reel
          path: dryrun_out/
          retention-days: 7

      # Posts nothing. Fails the run early, with a readable reason, if the
      # Instagram token is expired. Runs on dry runs too, so you can test it.
      - name: Check Instagram token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_reel.py --check-token

      - name: Commit and push generated post
        if: ${{ steps.build.outputs.generated == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add posts/
          git commit -m "Post $(cat posts/latest.txt)" || echo "Nothing to commit"
          git push

      - name: Publish reel to Instagram
        if: ${{ steps.build.outputs.generated == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: python scripts/post_reel.py

      # Only after a successful publish: mark the queue item as used so it
      # is never posted twice.
      - name: Mark queue item as published
        if: ${{ steps.build.outputs.generated == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          python scripts/carousel_reel.py --mark-published
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add content/state.json
          git commit -m "Mark $(cat posts/latest_item.txt) as published" || echo "Nothing to commit"
          git push
