name: Rooted and Rich - 3x Daily Post

on:
  schedule:
    # All times in UTC. IST = UTC + 5:30
    - cron: '0 19 * * *'    # 12:30 AM IST — catches late US evening scrollers
    - cron: '30 0 * * *'    # 6:00 AM IST — early peak window
    - cron: '30 3 * * *'    # 9:00 AM IST — highest peak window
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab to test
# Ensures overlapping runs queue up one after another instead of racing
# to save their changes at the same time.
concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate this run's image + caption
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_image.py

      - name: Commit and push generated post
        run: |
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add posts/
          git commit -m "Post $(cat posts/latest.txt)" || echo "Nothing to commit"
          git pull --rebase --autostash
          git push

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_to_instagram.py
