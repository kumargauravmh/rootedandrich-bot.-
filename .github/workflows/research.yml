name: Rooted and Rich - Research Next Reel

on:
  schedule:
    # UTC. Two tries a day (10:00 AM and 10:00 PM IST) in case GitHub skips one.
    # Each run researches ONE subject, and does nothing if 3 reels are already
    # queued, so the queue stays ~3 posts ahead. That gap is your window to
    # cancel or edit a queued post.
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = research and print the draft in the log, queue nothing'
        default: 'true'
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: research-lane
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure ffmpeg (one test builds a real video)
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: pip install pillow requests

      # Cheap guard: if someone edits the fact-check logic and breaks it,
      # this fails before anything gets queued.
      - name: Run fact-check tests
        run: |
          python -m unittest discover -s tests > test_output.txt 2>&1 || {
            echo "::error title=Tests failed::$(grep -E '^(FAIL|ERROR):|Error' test_output.txt | head -6 | tr '\n' ' ')"
            tail -40 test_output.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Research next figure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/research_carousel.py --dry-run
          else
            python scripts/research_carousel.py
          fi

      # Dry run: show the whole draft on this run's summary page (no log digging)
      - name: Show draft on the summary page
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        run: |
          if [ -f review_issue.md ]; then cat review_issue.md >> $GITHUB_STEP_SUMMARY; \
          else echo "No draft was produced. Open the 'Research next figure' step for the reason." >> $GITHUB_STEP_SUMMARY; fi

      - name: Commit queued reel
        if: ${{ github.event.inputs.dry_run != 'true' && hashFiles('review_title.txt') != '' }}
        run: |
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add content/
          git commit -m "Queue: $(cat review_title.txt)" || echo "Nothing to commit"
          git pull --rebase
          git push

      # Opens a GitHub issue (GitHub emails you) with the full hook and points, the
      # word-for-word evidence behind each one, and the sources.
      - name: Open review issue
        if: ${{ github.event.inputs.dry_run != 'true' && hashFiles('review_issue.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat review_title.txt)" --body-file review_issue.md
