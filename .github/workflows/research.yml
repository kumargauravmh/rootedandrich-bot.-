name: Rooted and Rich - Research Next Carousel

on:
  schedule:
    # UTC. 04:30 UTC = 10:00 AM IST. One new carousel per run, 3 runs a week,
    # matching the 3 posts a week, so the queue stays about 2 posts ahead of
    # posting. That gap is your window to cancel or edit a queued post.
    - cron: '30 4 * * 1'   # Monday
    - cron: '30 4 * * 3'   # Wednesday
    - cron: '30 4 * * 6'   # Saturday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = research and print the draft in the log, queue nothing'
        default: 'true'
        required: true

permissions:
  contents: write
  issues: write

# Shares one lane with the posting workflow so they never push at the same time
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      # Cheap guard: if someone edits the fact-check logic and breaks it,
      # this fails before anything gets queued.
      - name: Run fact-check tests
        run: python -m unittest discover -s tests

      - name: Research next figure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/research_carousel.py --dry-run
          else
            python scripts/research_carousel.py
          fi

      # Dry run: show the whole draft on this run's summary page (no log digging)
      - name: Show draft on the summary page
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        run: |
          if [ -f review_issue.md ]; then cat review_issue.md >> $GITHUB_STEP_SUMMARY; \
          else echo "No draft was produced. Open the 'Research next figure' step for the reason." >> $GITHUB_STEP_SUMMARY; fi

      - name: Commit queued carousel
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add content/
          git commit -m "Queue: $(cat review_title.txt)" || echo "Nothing to commit"
          git pull --rebase
          git push

      # Opens a GitHub issue (GitHub emails you) with the full slides, the
      # word-for-word evidence behind each one, and the sources.
      - name: Open review issue
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat review_title.txt)" --body-file review_issue.md
