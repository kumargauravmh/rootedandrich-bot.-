name: Rooted and Rich - Weekly Content Batch

on:
  schedule:
    # Saturday 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * 6'
  workflow_dispatch: {}   # run it manually from the Actions tab to test

permissions:
  contents: write

concurrency:
  group: weekly-content
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Scout the reference pages
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/trend_scout.py

      - name: Write the 7 posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_weekly.py

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py

      # Backup in case Telegram fails: download the images from the run page
      - name: Keep a copy of the batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-batch
          path: |
            weekly/
            data/
          if-no-files-found: ignore

      - name: Save trend data history
        run: |
          git config user.name "rootedandrich-bot"
          git config user.email "rootedandrich-bot@users.noreply.github.com"
          git add -f data/trends.json data/account_report.md
          git commit -m "Weekly trend data $(date -u +%F)" || echo "Nothing to commit"
          git push || echo "Push skipped"
