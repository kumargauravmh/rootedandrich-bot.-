name: Rooted and Rich - Weekly Analytics Pull

on:
  workflow_dispatch:      # lets you trigger it manually too, like your posting workflow
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (~8:30 AM IST) — adjust as you like

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run analytics script
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/analytics.py

      - name: Commit updated log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add analytics_log.json
          git commit -m "Update analytics log [automated]" || echo "No changes to commit"
          git push
